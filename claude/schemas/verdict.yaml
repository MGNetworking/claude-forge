# Schéma du livrable « verdict » (rôles reviewer, relecteur), au format JSON Schema écrit en YAML.
# Le programme valide la FORME avec ce schéma, puis :
# un refus contient au moins une remarque, et chaque remarque cite un fichier présent dans le diff.
# Un verdict ne conclut jamais seul : un refus renvoie au travail ; une acceptation ne vaut que si les
# vérifications du projet passent aussi.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: verdict
type: object
additionalProperties: false
required: [decision, remarques]
properties:
  decision:
    enum: [accepte, refuse]
  remarques:
    type: array
    items:
      type: object
      additionalProperties: false
      required: [fichier, remarque]
      properties:
        fichier: { type: string, minLength: 1 }
        ligne: { type: integer, minimum: 1 }
        remarque: { type: string, minLength: 1 }
