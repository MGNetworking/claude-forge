# Schéma du livrable « plan » (rôle architect), au format JSON Schema écrit en YAML.
# Le programme valide la FORME avec ce schéma, puis la cohérence avec le dépôt :
# chaque fichier « à modifier » existe, chaque fichier « à créer » n'existe pas.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: plan
type: object
additionalProperties: false
required: [resume, etapes, tests_prevus]
properties:
  resume:
    type: string
    minLength: 1
  etapes:
    type: array
    minItems: 1
    items:
      type: object
      additionalProperties: false
      required: [description]
      properties:
        description: { type: string, minLength: 1 }
        fichiers_a_modifier: { type: array, items: { type: string } }
        fichiers_a_creer: { type: array, items: { type: string } }
  tests_prevus:
    type: array
    minItems: 1
    items: { type: string, minLength: 1 }
  questions:
    description: >-
      Ce que l'utilisateur doit trancher avant le code (besoin ambigu, valeur « à définir »). Le programme
      les lui pose, chacune avec ses choix numérotés et décrits, puis fait refaire le plan avec ses réponses.
    type: array
    items:
      type: object
      additionalProperties: false
      required: [question, contexte, choix]
      properties:
        question: { type: string, minLength: 1 }
        contexte:
          description: >-
            Pourquoi la question se pose, en mots simples, pour quelqu'un qui ne connaît pas le sujet : ce qui
            arrive si on ne tranche pas, et le sens de tout mot technique employé.
          type: string
          minLength: 1
        choix:
          description: >-
            Les réponses possibles, chacune décrite par sa conséquence ; exactement une porte
            `recommande: true`. Le programme ajoute « décide, toi », qui vaut le choix recommandé.
          type: array
          minItems: 2
          contains: { required: [recommande], properties: { recommande: { const: true } } }
          minContains: 1
          maxContains: 1
          items:
            type: object
            additionalProperties: false
            required: [reponse, description]
            properties:
              reponse: { type: string, minLength: 1 }
              description: { type: string, minLength: 1 }
              recommande: { const: true }
