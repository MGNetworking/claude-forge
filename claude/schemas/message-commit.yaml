# Schéma du livrable « message-commit » (rôle livreur), au format JSON Schema écrit en YAML.
# Le programme (agent-engine) valide la FORME avec ce schéma, puis commite avec ce message ; il ajoute
# lui-même la référence du ticket en pied de message (« Refs: <clé> »), qui n'est pas au livreur.
# Le sujet suit Conventional Commits : Release Please en tire la version et le CHANGELOG.
$schema: "https://json-schema.org/draft/2020-12/schema"
title: message-commit
type: object
additionalProperties: false
required: [sujet]
properties:
  sujet:
    description: "type(portée facultative): résumé, en une ligne"
    type: string
    maxLength: 72
    pattern: "^(feat|fix|docs|style|refactor|perf|test|build|ci|chore|revert)(\\([^()\\s]+\\))?!?: \\S.*$"
  corps:
    description: Pourquoi le changement, et ce qu'il change, en quelques lignes.
    type: string
