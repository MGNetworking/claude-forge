# Cycle « article » : rédiger puis relire un article Markdown. Exemple d'un cycle qui n'est pas du code.
# Format PROPOSÉ (v0) : il sera fixé quand agent-engine saura exécuter les cycles.
# La vérification mécanique (lint Markdown, en-tête, longueur, liens) vient du profil du projet d'articles,
# écrit par `agent init` ; le jugement (fond, ton) passe par le verdict du relecteur.
name: article
description: Rédiger, puis relire
start: redaction

nodes:
  redaction:
    role: redacteur
    livrable: fichiers        # les commandes du profil du projet passent, le projet est modifié
  relecture:
    role: relecteur
    livrable: verdict
    outils: lecture

transitions:
  redaction: { valide: relecture }
  relecture: { accepte: fin, refuse: redaction }

limits:
  tours_par_noeud: 5
  allers_retours: 3
